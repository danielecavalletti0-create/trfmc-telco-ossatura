[pytest]
# Pytest configuration for TRFMC backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage options (when run with --cov)
# pytest --cov=app --cov-report=html tests/

# Test paths
testpaths = tests

# Timeout (seconds) - prevent hanging tests
timeout = 30

# Markers
markers =
    unit: unit tests
    integration: integration tests
    slow: slow tests
    async: async tests
    api: API tests

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Asyncio mode
asyncio_mode = auto
